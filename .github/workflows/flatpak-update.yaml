name: Update flatpak
on:
  workflow_dispatch:
    inputs:
      ref_name:
        description: tag (leave blank to update the beta branch)
        required: false
      sha:
        description: sha
        required: true
jobs:
  update-flatpak:
    runs-on: ubuntu-latest
    steps:
      - name: Determine ref and flathub branch
        id: ref
        env:
          REF_NAME: ${{ inputs.ref_name }}
        run: |
          REF="${REF_NAME:-beta}"
          echo "ref=${REF}" >> $GITHUB_OUTPUT
          if [[ "$REF" == *"beta"* ]]; then
            echo "branch=beta" >> $GITHUB_OUTPUT
          else
            echo "branch=master" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v6
        with:
          repository: flathub/io.github.mmp.Vice
          ref: ${{ steps.ref.outputs.branch }}
          path: flathub
      - uses: actions/checkout@v6
        with:
          repository: mmp/vice
          ref: ${{ steps.ref.outputs.ref }}
          path: vice
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Update go modules
        working-directory: flathub
        run: |
          go run github.com/dennwc/flatpak-go-mod@latest ../vice
      - name: Update vice resources
        working-directory: vice
        run: |
          BASE_URL="https://vice-resources.pharr.org"
          jq -r 'to_entries[] | "\(.key)\t\(.value.hash)\t\(.value.size)"' resources/models/manifest.json | \
          while IFS=$'\t' read -r filepath hash size; do
            dir=$(dirname "$filepath")
            filename=$(basename "$filepath")
            if [[ "$dir" == "." ]]; then
                dest="resources/models"
            else
                dest="resources/models/${dir}"
            fi
            echo "- type: file"
            echo "  url: ${BASE_URL}/${hash}"
            echo "  sha256: ${hash}"
            echo "  dest: ${dest}"
            echo "  dest-filename: ${filename}"
          done > ../flathub/vice-resources.yaml
      - name: Update tag and sha
        working-directory: flathub
        env:
          REF: ${{ steps.ref.outputs.ref }}
          SHA: ${{ inputs.sha }}
        run: |
          yq -i '(.modules[] | select(.name == "vice") | .sources[0].tag) = strenv(REF)' io.github.mmp.Vice.yml
          yq -i '(.modules[] | select(.name == "vice") | .sources[0].commit) = strenv(SHA)' io.github.mmp.Vice.yml
      - name: Create pull request
        if: ${{ success() }}
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          path: flathub
          token: ${{ secrets.FLATHUB_TOKEN }}
          branch: update/${{ steps.ref.outputs.ref }}
          commit-message: update to ${{ steps.ref.outputs.ref }}
          title: Update to ${{ steps.ref.outputs.ref }}
          delete-branch: true
          sign-commits: true
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
