name: Update flatpak
on:
  workflow_dispatch:
    inputs:
      ref_name:
        description: tag (leave blank to update the beta branch)
        required: false
      sha:
        description: sha
        required: true
jobs:
  update-flatpak:
    runs-on: ubuntu-latest
    steps:
      - name: Determine ref and flathub branch
        id: ref
        env:
          REF_NAME: ${{ inputs.ref_name }}
          SHA: ${{ inputs.sha }}
        run: |
          if [[ -n "$REF_NAME" ]]; then
            # A tag was given: check vice out at that tag, and derive the
            # flathub branch from whether it looks like a beta tag.
            echo "vice_ref=${REF_NAME}" >> $GITHUB_OUTPUT
            echo "label=${REF_NAME}" >> $GITHUB_OUTPUT
            if [[ "$REF_NAME" == *"beta"* ]]; then
              echo "branch=beta" >> $GITHUB_OUTPUT
            else
              echo "branch=master" >> $GITHUB_OUTPUT
            fi
          else
            # No tag given: check vice out at the exact commit
            echo "vice_ref=${SHA}" >> $GITHUB_OUTPUT
            echo "label=beta-${SHA:0:7}" >> $GITHUB_OUTPUT
            echo "branch=beta" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v6
        with:
          repository: flathub/io.github.mmp.Vice
          ref: ${{ steps.ref.outputs.branch }}
          path: flathub
      - uses: actions/checkout@v6
        with:
          repository: mmp/vice
          ref: ${{ steps.ref.outputs.vice_ref }}
          path: vice
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Update go modules
        working-directory: flathub
        run: |
          go run github.com/dennwc/flatpak-go-mod@latest ../vice
      - name: Update vice resources
        working-directory: vice
        run: |
          BASE_URL="https://vice-resources.pharr.org"
          jq -r 'to_entries[] | "\(.key)\t\(.value.hash)\t\(.value.size)"' resources/models/manifest.json | \
          while IFS=$'\t' read -r filepath hash size; do
            dir=$(dirname "$filepath")
            filename=$(basename "$filepath")
            if [[ "$dir" == "." ]]; then
                dest="resources/models"
            else
                dest="resources/models/${dir}"
            fi
            echo "- type: file"
            echo "  url: ${BASE_URL}/${hash}"
            echo "  sha256: ${hash}"
            echo "  dest: ${dest}"
            echo "  dest-filename: ${filename}"
          done > ../flathub/vice-resources.yaml
      - name: Update tag and sha
        working-directory: flathub
        env:
          REF_NAME: ${{ inputs.ref_name }}
          SHA: ${{ inputs.sha }}
        run: |
          yq -i '(.modules[] | select(.name == "vice") | .sources[0].commit) = strenv(SHA)' io.github.mmp.Vice.yml
          if [[ -n "$REF_NAME" ]]; then
            yq -i '(.modules[] | select(.name == "vice") | .sources[0].tag) = strenv(REF_NAME)' io.github.mmp.Vice.yml
          else
            # No tag for this update (pinned by commit only) - drop any
            # stale tag left over from a previous tagged release.
            yq -i '(.modules[] | select(.name == "vice") | .sources[0]) |= del(.tag)' io.github.mmp.Vice.yml
          fi
      - name: Create pull request
        if: ${{ success() }}
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          path: flathub
          token: ${{ secrets.FLATHUB_TOKEN }}
          branch: update/${{ steps.ref.outputs.label }}
          commit-message: update to ${{ steps.ref.outputs.label }}
          title: Update to ${{ steps.ref.outputs.label }}
          delete-branch: true
          sign-commits: true
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
